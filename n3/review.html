<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<title>Review · 日本語 N3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../ikon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3b5bff">
<link rel="stylesheet" href="../aset/tz.css?v=1">
</head>
<body>
<div class="wrap">
<div class="atas"><a class="kembali" href="index.html">‹</a><h1>Review</h1><div class="kanan">N3</div></div>

<div class="label" style="margin-bottom:10px" id="jml">—</div>
<div class="flash" id="kartu" onclick="buka()">
  <div class="awal" id="awal">ULANG</div>
  <div class="huruf" id="huruf">—</div>
  <div class="kana" id="kana"></div>
  <div class="arti" id="arti" style="display:none"></div>
  <div class="hint" id="hint">ketuk untuk balik</div>
</div>
<div class="nilai3" id="nilai" style="display:none">
  <button class="l" onclick="nilai('lupa')">Masih lupa</button>
  <button class="r" onclick="nilai('ragu')">Ragu</button>
  <button class="h" onclick="nilai('hafal')">Hafal</button>
</div>
<div class="kartu" id="kosong" style="display:none"><div class="kosong">
  Tidak ada kata yang perlu diulang ✓<br><span class="kecil">Kerjakan kosakata dulu.</span></div></div>

</div>

<script src="../aset/tz.js?v=1"></script>
<script>
let daftar = [], idx = 0, terbuka = false;
(async () => {
  daftar = TZ.baca('salah', []);
  document.getElementById('jml').textContent = daftar.length + ' kata menunggu';
  if (!daftar.length) {
    document.getElementById('kosong').style.display = '';
    document.getElementById('kartu').style.display = 'none';
    return;
  }
  tampil();
})();
function tampil() {
  const x = daftar[idx];
  if (!x) { document.getElementById('kartu').innerHTML = '<div class="huruf">✓</div>' +
    '<div class="kana">selesai</div>'; document.getElementById('nilai').style.display='none'; return; }
  terbuka = false;
  document.getElementById('huruf').textContent = x.kanji;
  document.getElementById('kana').textContent = '';
  document.getElementById('arti').style.display = 'none';
  document.getElementById('nilai').style.display = 'none';
  document.getElementById('hint').textContent = 'ketuk untuk balik';
}
function buka() {
  const x = daftar[idx]; if (!x) return;
  terbuka = !terbuka;
  document.getElementById('kana').textContent = terbuka ? (x.yomi||'') : '';
  document.getElementById('arti').textContent = x.arti || '';
  document.getElementById('arti').style.display = terbuka ? '' : 'none';
  document.getElementById('nilai').style.display = terbuka ? '' : 'none';
  if (terbuka && x.jp) TZ.ucap(x.jp);
}
function nilai(n) {
  if (n === 'hafal') {
    const s = TZ.baca('salah', []).filter(y => y.kanji !== daftar[idx].kanji);
    TZ.simpan('salah', s);
  }
  idx++;
  document.getElementById('jml').textContent = Math.max(0, daftar.length - idx) + ' kata menunggu';
  tampil();
}
</script>
</body>
</html>
