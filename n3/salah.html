<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<title>Salah · 日本語 N3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../ikon-192.png">

<body>
<div class="wrap">
<div class="atas"><a class="kembali" href="index.html">‹</a><h1>Salah</h1><div class="kanan">N3</div></div>

<div class="label" style="margin-bottom:10px">Kata yang pernah salah</div>
<div id="isi"></div>

</div>

<script src="../aset/tz.js?v=1"></script>
<script>
(async () => {
  const d = TZ.baca('salah', []);
  const el = document.getElementById('isi');
  if (!d.length) {
    el.innerHTML = '<div class="kartu"><div class="kosong">Belum ada ✓</div></div>'; return;
  }
  el.innerHTML = d.slice().reverse().map(x => `
<div class="baris"><span class="ik">${TZ.esc(x.kanji)}</span>
  <span><b>${TZ.esc(x.yomi||'')}</b><small>${TZ.esc(x.arti||'')}</small></span></div>`).join('');
})();
</script>
</body>
</html>
