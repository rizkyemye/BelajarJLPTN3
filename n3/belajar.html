<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<title>Kosakata · 日本語 N3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../aset/tz.css?v=1">
</head>
<body>
<div class="wrap">
<div class="atas"><a class="kembali" href="index.html">‹</a><h1>Kosakata</h1><div class="kanan">N3</div></div>

<div class="pil" id="hari"></div>
<div class="prog" style="margin-bottom:14px"><i id="bar" style="width:0%"></i></div>

<div class="flash" id="kartu" onclick="buka()">
  <div class="awal" id="awal">KATA</div>
  <div class="huruf" id="huruf">—</div>
  <div class="kana" id="kana"></div>
  <div class="arti" id="arti" style="display:none"></div>
  <div class="hint" id="hint">ketuk untuk balik</div>
</div>

<div class="nilai3" id="nilai" style="display:none">
  <button class="l" onclick="nilai('lupa')">Lupa</button>
  <button class="r" onclick="nilai('ragu')">Ragu</button>
  <button class="h" onclick="nilai('hafal')">Hafal</button>
</div>

<div class="kartu" id="kotakContoh" style="display:none">
  <div class="label">Contoh</div>
  <div class="contoh" id="contoh"></div>
</div>

<div class="label" style="margin:18px 0 10px">Isi hari ini</div>
<div id="deret" style="display:flex;flex-wrap:wrap;gap:6px"></div>

</div>

<nav class="nav" style="--i:1">
  <span class="nav-tanda"></span>
  <a href="index.html" class=""><span class="ik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1z"/></svg></span><em>Beranda</em></a>
  <a href="belajar.html" class="aktif"><span class="ik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h9a3 3 0 013 3v11a3 3 0 00-3-3H4z"/><path d="M20 5h-3a3 3 0 00-3 3v11"/></svg></span><em>Kosakata</em></a>
  <a href="tryout.html" class=""><span class="ik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg></span><em>Try out</em></a>
  <a href="kanji-daftar.html" class=""><span class="ik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/></svg></span><em>Kanji</em></a>
  <a href="bunpou.html" class=""><span class="ik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg></span><em>Bunpou</em></a>
</nav>

<script src="../aset/tz.js?v=1"></script>
<script>
let semua = [], hariIni = [], idx = 0, terbuka = false, daftarHari = [];

(async () => {
  semua = await TZ.data('data.json');
  daftarHari = [...new Set(semua.map(x => x.hari))].sort((a,b)=>a-b);
  const pilih = TZ.baca('hariTerakhir', daftarHari[0]);
  document.getElementById('hari').innerHTML = daftarHari.map(h =>
    `<button class="${h===pilih?'aktif':''}" onclick="gantiHari(${h})">Hari ${h}</button>`).join('');
  muatHari(pilih);
})();

function gantiHari(h) {
  TZ.simpan('hariTerakhir', h);
  [...document.querySelectorAll('#hari button')]
    .forEach(b => b.classList.toggle('aktif', b.textContent === 'Hari ' + h));
  muatHari(h);
}

function muatHari(h) {
  hariIni = semua.filter(x => x.hari === h);
  idx = 0;
  tampil();
}

function deret() {
  const el = document.getElementById('deret');
  if (!el) return;
  el.innerHTML = hariIni.map((y, i) => {
    const aktif = i === idx;
    const sudah = i < idx;
    const bg = aktif ? 'var(--biru)' : (sudah ? 'var(--hijaumuda)' : 'var(--kartu)');
    const fg = aktif ? '#fff' : (sudah ? '#1f9d55' : 'var(--redup)');
    const bd = aktif ? 'var(--biru)' : (sudah ? 'var(--hijau)' : 'var(--garis)');
    return `<span style="background:${bg};color:${fg};border:1px solid ${bd};border-radius:10px;
      padding:6px 9px;font-size:13px;font-weight:600">${TZ.esc(y.kanji)}</span>`;
  }).join('');
}

function tampil() {
  const x = hariIni[idx];
  if (!x) return;
  terbuka = false;
  deret();
  document.getElementById('huruf').textContent = x.kanji;
  document.getElementById('kana').textContent = terbuka ? x.yomi : '';
  document.getElementById('kana').textContent = '';
  document.getElementById('arti').style.display = 'none';
  document.getElementById('hint').style.display = '';
  document.getElementById('hint').textContent = 'ketuk untuk balik';
  document.getElementById('nilai').style.display = 'none';
  document.getElementById('kotakContoh').style.display = 'none';
  document.getElementById('awal').textContent = (x.kelas || 'kata').toUpperCase();
  const p = Math.round(idx / hariIni.length * 100);
  document.getElementById('bar').style.width = p + '%';
}

function buka() {
  const x = hariIni[idx];
  if (!x) return;
  terbuka = !terbuka;
  document.getElementById('kana').textContent = terbuka ? x.yomi : '';
  document.getElementById('arti').style.display = terbuka ? '' : 'none';
  document.getElementById('arti').textContent = x.arti;
  document.getElementById('hint').textContent = terbuka ? 'nilai dirimu' : 'ketuk untuk balik';
  document.getElementById('nilai').style.display = terbuka ? '' : 'none';
  const c = document.getElementById('kotakContoh');
  if (terbuka && x.jp) {
    c.style.display = '';
    document.getElementById('contoh').innerHTML =
      TZ.esc(x.jp) + '<span class="id">' + TZ.esc(x.id) + '</span>';
    TZ.ucap(x.jp);
  } else { c.style.display = 'none'; }
}

function nilai(n) {
  const x = hariIni[idx];
  const h = TZ.baca('hafal', {});
  if (n === 'hafal') { h[x.kanji] = Date.now(); }
  else if (n === 'lupa') { delete h[x.kanji]; }
  TZ.simpan('hafal', h);
  if (n === 'lupa' || n === 'ragu') {
    const s = TZ.baca('salah', []);
    if (!s.find(y => y.kanji === x.kanji)) s.push(x);
    TZ.simpan('salah', s.slice(-200));
  }
  idx++;
  if (idx >= hariIni.length) {
    const nx = daftarHari[daftarHari.indexOf(x.hari) + 1];
    if (nx) { TZ.simpan('hariTerakhir', nx); muatHari(nx);
      [...document.querySelectorAll('#hari button')]
        .forEach(b => b.classList.toggle('aktif', b.textContent === 'Hari ' + nx)); }
    else { document.getElementById('huruf').textContent = '✓';
      document.getElementById('kana').textContent = 'selesai semua hari'; 
      document.getElementById('nilai').style.display = 'none'; }
    return;
  }
  tampil();
}
</script>
</body>
</html>
