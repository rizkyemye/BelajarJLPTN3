<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<title>Kosakata · 日本語 N3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>
<div class="wrap">
<div class="atas"><a class="kembali" href="index.html">‹</a><h1>Kosakata</h1><div class="kanan">N3</div></div>

<div class="hari-grup" id="grup"></div>

<div class="flip" id="flip" onclick="balik()">
  <div class="flip-dalam" id="dalam">
    <div class="flip-depan">
      <div class="awal" id="awal">KATA</div>
      <div class="huruf" id="huruf">—</div>
      <div class="hint">ketuk untuk balik</div>
    </div>
    <div class="flip-belakang">
      <div class="awal">ARTI</div>
      <div class="belakang-kana" id="kana">—</div>
      <div class="belakang-arti" id="arti">—</div>
      <div class="belakang-contoh" id="contoh"></div>
    </div>
  </div>
</div>

<div class="nilai3" id="nilai">
  <button class="l" onclick="nilai('lupa')">Lupa</button>
  <button class="r" onclick="nilai('ragu')">Ragu</button>
  <button class="h" onclick="nilai('hafal')">Hafal</button>
</div>

<div class="kartu" id="ref" style="margin-top:14px;display:none">
  <div class="label">Referensi</div>
  <div class="ref-baris"><span>Kana</span><b id="refKana">—</b></div>
  <div class="ref-baris"><span>Arti</span><b id="refArti">—</b></div>
  <div class="ref-baris"><span>Kelas</span><b id="refKelas">—</b></div>
  <div class="ref-baris"><span>Hari</span><b id="refHari">—</b></div>
  <div id="refSearti"></div>
  <div id="refKanji"></div>
  <div style="margin-top:10px">
    <button class="btn g" onclick="TZ.ucap(document.getElementById('huruf').textContent)">▶ Dengarkan</button>
  </div>
</div>

<div class="nav-kartu">
  <button class="pn" onclick="geser(-1)" aria-label="sebelumnya">‹</button>
  <div class="progres-kartu">
    <div class="pk-angka"><b id="posisi">1</b><span id="total">/ 30</span></div>
    <div class="prog"><i id="bar" style="width:0%"></i></div>
  </div>
  <button class="pn" onclick="geser(1)" aria-label="berikutnya">›</button>
</div>

<div class="kartu">
  <div class="label">Catatan <span class="cat-otomatis" id="tagOtomatis">otomatis</span></div>
  <textarea id="catatan" rows="2" placeholder="catatan pribadi untuk kata ini…"
    oninput="simpanCatatan()"></textarea>
</div>

</div>

<nav class="nav" style="--i:1">
  <span class="nav-tanda"></span>
  <a href="index.html" class=""><span class="ik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1z"/></svg></span><em>Beranda</em></a>
  <a href="belajar.html" class="aktif"><span class="ik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h9a3 3 0 013 3v11a3 3 0 00-3-3H4z"/><path d="M20 5h-3a3 3 0 00-3 3v11"/></svg></span><em>Kosakata</em></a>
  <a href="tryout.html" class=""><span class="ik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg></span><em>Try out</em></a>
  <a href="kanji-daftar.html" class=""><span class="ik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/></svg></span><em>Kanji</em></a>
  <a href="bunpou.html" class=""><span class="ik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg></span><em>Bunpou</em></a>
</nav>

<script src="../aset/tz.js?v=1"></script>
<script>
let semua = [], hariIni = [], idx = 0, daftarHari = [], terbuka = false;
let temaMap = {}, kanjiMap = {}, catatanMap = {}, temaAktif = 1;

(async () => {
  semua = await TZ.data('data.json');
  daftarHari = [...new Set(semua.map(x => x.hari))].sort((a,b)=>a-b);
  try {
    const t = await TZ.data('tema.json');
    t.forEach(x => { temaMap[x.hari_ke] = x; });
  } catch (e) {}
  try {
    const k = await TZ.data('kanji.json');
    k.forEach(x => { kanjiMap[x.kanji] = x; });
  } catch (e) {}
  try { catatanMap = await TZ.data('catatan.json'); } catch (e) {}
  const pilih = TZ.baca('hariTerakhir', daftarHari[0]);
  temaAktif = pilih;
  gambarGrup(pilih);
  muatHari(pilih);
})();

function labelHari(h) {
  const t = temaMap[h];
  return t ? t.tema : 'Hari ' + h;
}

function gambarGrup(pilih) {
  temaAktif = pilih;
  const pil = daftarHari.map(h => {
    const t = temaMap[h] || {};
    return `<button class="pil-tema ${h===pilih?'aktif':''}" onclick="gantiHari(${h})">
      <b>${TZ.esc(t.tema || 'Hari ' + h)}</b>
      <small>hari ${h}</small></button>`;
  }).join('');
  document.getElementById('grup').innerHTML = `<div class="grup-pil">${pil}</div>`;
}

function gantiHari(h) {
  TZ.simpan('hariTerakhir', h);
  document.querySelectorAll('.pil-hari').forEach(b =>
    b.classList.toggle('aktif', b.textContent === 'Hari ' + h));
  muatHari(h);
}

function muatHari(h) {
  hariIni = semua.filter(x => x.hari === h);
  idx = 0;
  tampil();
}

function kartu() { return document.getElementById('dalam'); }

function tampil() {
  const x = hariIni[idx];
  if (!x) return;
  terbuka = false;
  kartu().classList.remove('balik');
  document.getElementById('huruf').textContent = x.kanji;
  document.getElementById('kana').textContent = x.yomi || '';
  document.getElementById('arti').textContent = x.arti || '';
  document.getElementById('contoh').innerHTML = x.jp ?
    TZ.esc(x.jp) + '<span class="id">' + TZ.esc(x.id) + '</span>' : '';
  document.getElementById('awal').textContent = (x.kelas || 'kata').toUpperCase();
  document.getElementById('ref').style.display = 'none';
  document.getElementById('refKana').textContent = x.yomi || '—';
  document.getElementById('refArti').textContent = x.arti || '—';
  document.getElementById('refKelas').textContent = x.kelas || '—';
  const t = temaMap[x.hari];
  document.getElementById('refHari').textContent =
    'Hari ' + x.hari + (t ? ' · ' + t.tema : '');

  // kosakata lain dengan arti sama
  const searti = semua.filter(y => y.kanji !== x.kanji &&
    (y.arti || '').toLowerCase() === (x.arti || '').toLowerCase());
  const elS = document.getElementById('refSearti');
  elS.innerHTML = searti.length ? `<div class="ref-blok">
    <div class="ref-judul">Kosakata searti</div>
    ${searti.slice(0, 6).map(y => `<div class="ref-item">
      <b>${TZ.esc(y.kanji)}</b> <span>${TZ.esc(y.yomi || '')}</span>
      <i>hari ${y.hari}</i></div>`).join('')}
  </div>` : '';

  // kanji yang dipakai
  const huruf = [...(x.kanji || '')].filter(c => /[一-鿿]/.test(c));
  const info = huruf.map(c => kanjiMap[c]).filter(Boolean);
  const elK = document.getElementById('refKanji');
  elK.innerHTML = info.length ? `<div class="ref-blok">
    <div class="ref-judul">Kanji dalam kata ini</div>
    ${info.map(k => `<div class="ref-item">
      <b class="ref-kanji">${TZ.esc(k.kanji)}</b>
      <span>${TZ.esc(k.arti || '')}</span>
      <i>${TZ.esc(k.kunyomi || k.onyomi || '')}</i></div>`).join('')}
  </div>` : '';

  deret();
}

function balik() {
  if (!hariIni[idx]) return;
  terbuka = !terbuka;
  kartu().classList.toggle('balik', terbuka);
  document.getElementById('ref').style.display = terbuka ? '' : 'none';
  if (terbuka) TZ.ucap(hariIni[idx].kanji);
}

function deret() {
  const total = hariIni.length;
  document.getElementById('posisi').textContent = Math.min(idx + 1, total);
  document.getElementById('total').textContent = '/ ' + total;
  document.getElementById('bar').style.width = Math.round(idx / total * 100) + '%';
  const x = hariIni[idx];
  if (!x) return;
  const cat = TZ.baca('catatan', {});
  const ta = document.getElementById('catatan');
  ta.value = cat[x.kanji] !== undefined ? cat[x.kanji] : catatanOtomatis(x);
  ta.dataset.otomatis = cat[x.kanji] === undefined ? '1' : '';
}

function catatanOtomatis(x) {
  if (catatanMap[x.kanji]) return catatanMap[x.kanji];
  const baris = [];
  const kelas = (x.kelas || '').trim();
  if (kelas) baris.push(kelas + ' · ' + (x.yomi || ''));
  const huruf = [...(x.kanji || '')].filter(c => /[一-鿿]/.test(c));
  const arti = huruf.map(c => kanjiMap[c]).filter(Boolean)
    .map(k => k.kanji + ' ' + (k.arti || '').split('/')[0].trim());
  if (arti.length) baris.push(arti.join(' · '));
  if (x.jp) baris.push(x.jp);
  return baris.join(String.fromCharCode(10));
}

function geser(arah) {
  const n = idx + arah;
  if (n < 0 || n >= hariIni.length) return;
  idx = n;
  tampil();
}

let jedaCatatan = null;
function simpanCatatan() {
  const x = hariIni[idx];
  if (!x) return;
  clearTimeout(jedaCatatan);
  jedaCatatan = setTimeout(() => {
    const el = document.getElementById('catatan');
    const cat = TZ.baca('catatan', {});
    const isi = el.value.trim();
    const otomatis = catatanOtomatis(x).trim();
    if (isi && isi !== otomatis) cat[x.kanji] = isi;
    else delete cat[x.kanji];
    TZ.simpan('catatan', cat);
  }, 400);
}

function nilai(n) {
  const x = hariIni[idx];
  const h = TZ.baca('hafal', {});
  if (n === 'hafal') h[x.kanji] = Date.now(); else delete h[x.kanji];
  TZ.simpan('hafal', h);
  if (n !== 'hafal') {
    const s = TZ.baca('salah', []);
    if (!s.find(y => y.kanji === x.kanji)) s.push(x);
    TZ.simpan('salah', s.slice(-300));
  }
  idx++;
  if (idx >= hariIni.length) {
    const pos = daftarHari.indexOf(x.hari);
    const nx = daftarHari[pos + 1];
    if (nx) { gantiHari(nx); }
    else {
      document.getElementById('huruf').textContent = '✓';
      document.getElementById('deret').innerHTML = '';
      document.getElementById('nilai').style.display = 'none';
    }
    return;
  }
  tampil();
}
</script>
</body>
</html>
