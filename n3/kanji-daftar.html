<script src="../aset/tz.js?v=1"></script>
<script>
let semua = [], aktif = null, mode = 'semua';

(async () => {
  semua = await TZ.data('kanji.json');
  gambar();
})();

function hafalMap() { return TZ.baca('kanjiHafal', {}); }

function gambar() {
  const hm = hafalMap();
  const data = semua.filter(x => mode === 'semua' ? true :
    (mode === 'hafal' ? hm[x.kanji] : !hm[x.kanji]));
  document.getElementById('jml').textContent = data.length + ' kanji';
  document.getElementById('grid').innerHTML = data.map((x, i) =>
    `<button class="${hm[x.kanji] ? 'hafal' : ''}" onclick="pilih(${semua.indexOf(x)})">` +
    TZ.esc(x.kanji) + '</button>').join('');
}

function pilih(i) {
  aktif = semua[i];
  document.getElementById('detail').style.display = '';
  document.getElementById('dk').textContent = aktif.kanji;
  document.getElementById('dony').textContent = '音読み ' + (aktif.onyomi || '—');
  document.getElementById('dkun').textContent = '訓読み ' + (aktif.kunyomi || '—');
  document.getElementById('darti').textContent = aktif.arti || '';
  document.getElementById('dbushu').textContent =
    aktif.bushu ? '部首 ' + aktif.bushu + ' — ' + (aktif.arti_bushu || '') : '';
  document.getElementById('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
  TZ.ucap(aktif.kanji);
}

function hafalKanji() {
  if (!aktif) return;
  const hm = hafalMap();
  hm[aktif.kanji] = Date.now();
  TZ.simpan('kanjiHafal', hm);
  gambar();
}

function saring(m, tombol) {
  mode = m;
  [...document.querySelectorAll('#filter button')].forEach(b => b.classList.remove('aktif'));
  tombol.classList.add('aktif');
  gambar();
}
</script>
