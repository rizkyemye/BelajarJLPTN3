<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<title>Kanji · 日本語 N3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../aset/tz.css?v=1">
</head>
<body>
<div class="wrap">
<div class="atas"><a class="kembali" href="index.html">‹</a><h1>Kanji</h1><div class="kanan">N3</div></div>

<div class="pil" id="filter">
  <button class="aktif" onclick="saring('semua',this)">Semua</button>
  <button onclick="saring('belum',this)">Belum hafal</button>
  <button onclick="saring('hafal',this)">Sudah hafal</button>
</div>
<div class="kartu" id="detail" style="display:none">
  <div style="display:flex;gap:16px;align-items:flex-start">
    <div style="font-size:56px;line-height:1;font-family:'Noto Sans JP',serif" id="dk">—</div>
    <div style="flex:1">
      <div class="sub" id="dony">—</div>
      <div style="margin-top:6px" id="dkun">—</div>
      <div style="margin-top:8px;font-size:15px" id="darti">—</div>
      <div class="kecil" style="margin-top:6px" id="dbushu"></div>
    </div>
  </div>
  <div class="grid2" style="margin-top:14px">
    <button class="btn g" onclick="TZ.ucap(document.getElementById('dk').textContent)">Dengarkan</button>
    <button class="btn p" onclick="hafalKanji()">Tandai hafal</button>
  </div>
</div>
<div class="label" style="margin:12px 0 8px" id="jml">—</div>
<div class="kanji-grid" id="grid"></div>

</div>

<nav class="nav">
  <a href="index.html" class=""><span>⌂</span>Beranda</a>
  <a href="belajar.html" class=""><span>単</span>Kosakata</a>
  <a href="practice.html" class=""><span>◆</span>Practice</a>
  <a href="kanji-daftar.html" class="aktif"><span>漢</span>Kanji</a>
  <a href="bunpou.html" class=""><span>文</span>Bunpou</a>
</nav>

<script src="../aset/tz.js?v=1"></script>
<script>
let semua = [], aktif = null, mode = 'semua';

(async () => {
  semua = await TZ.data('kanji.json');
  gambar();
})();

function hafalMap() { return TZ.baca('kanjiHafal', {}); }

function gambar() {
  const hm = hafalMap();
  const data = semua.filter(x => mode === 'semua' ? true :
    (mode === 'hafal' ? hm[x.kanji] : !hm[x.kanji]));
  document.getElementById('jml').textContent = data.length + ' kanji';
  document.getElementById('grid').innerHTML = data.map((x, i) =>
    `<button class="${hm[x.kanji] ? 'hafal' : ''}" onclick="pilih(${semua.indexOf(x)})">` +
    TZ.esc(x.kanji) + '</button>').join('');
}

function pilih(i) {
  aktif = semua[i];
  document.getElementById('detail').style.display = '';
  document.getElementById('dk').textContent = aktif.kanji;
  document.getElementById('dony').textContent = '音読み ' + (aktif.onyomi || '—');
  document.getElementById('dkun').textContent = '訓読み ' + (aktif.kunyomi || '—');
  document.getElementById('darti').textContent = aktif.arti || '';
  document.getElementById('dbushu').textContent =
    aktif.bushu ? '部首 ' + aktif.bushu + ' — ' + (aktif.arti_bushu || '') : '';
  document.getElementById('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
  TZ.ucap(aktif.kanji);
}

function hafalKanji() {
  if (!aktif) return;
  const hm = hafalMap();
  hm[aktif.kanji] = Date.now();
  TZ.simpan('kanjiHafal', hm);
  gambar();
}

function saring(m, tombol) {
  mode = m;
  [...document.querySelectorAll('#filter button')].forEach(b => b.classList.remove('aktif'));
  tombol.classList.add('aktif');
  gambar();
}
</script>
</body>
</html>
