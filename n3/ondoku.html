<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<title>音読 · 日本語 N3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../aset/tz.css?v=1">
</head>
<body>
<div class="wrap">
<div class="atas"><a class="kembali" href="index.html">‹</a><h1>音読</h1><div class="kanan">N3</div></div>

<div class="pil" id="hari"></div>
<div class="kartu">
  <div class="label">Baca keras</div>
  <div class="contoh" style="font-size:18px;line-height:2" id="teks">—</div>
  <div class="kecil" style="margin-top:10px" id="arti">—</div>
  <div class="grid2" style="margin-top:14px">
    <button class="btn g" onclick="dengar()">▶ Contoh suara</button>
    <button class="btn p" onclick="selesai()">Sudah baca</button>
  </div>
  <div class="kecil" style="margin-top:12px" id="status"></div>
</div>

</div>

<script src="../aset/tz.js?v=1"></script>
<script>
let semua = [], hariAktif = 0, idx = 0;
(async () => {
  semua = await TZ.data('dokkai.json');
  const hari = [...new Set(semua.map(x => x.hari_ke))].sort((a,b)=>a-b);
  hariAktif = hari[0];
  document.getElementById('hari').innerHTML = hari.map(h =>
    `<button class="${h===hariAktif?'aktif':''}" onclick="pilih(${h})">Hari ${h}</button>`).join('');
  tampil();
})();
function daftar() { return semua.filter(x => x.hari_ke === hariAktif); }
function pilih(h) {
  hariAktif = h; idx = 0;
  [...document.querySelectorAll('#hari button')].forEach(b =>
    b.classList.toggle('aktif', b.textContent === 'Hari ' + h));
  tampil();
}
function tampil() {
  const x = daftar()[idx];
  if (!x) { document.getElementById('teks').textContent = 'selesai ✓'; return; }
  document.getElementById('teks').textContent = x.teks_jp || '';
  document.getElementById('arti').textContent = x.teks_id || '';
  document.getElementById('status').textContent = (idx + 1) + ' / ' + daftar().length;
}
function dengar() {
  const x = daftar()[idx]; if (x) TZ.ucap(x.teks_jp || '');
}
function selesai() { idx++; tampil(); }
</script>
</body>
</html>
