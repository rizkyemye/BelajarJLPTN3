<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<title>Choukai · 日本語 N3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../ikon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3b5bff">
<link rel="stylesheet" href="../aset/tz.css?v=1">
</head>
<body>
<div class="wrap">
<div class="atas"><a class="kembali" href="index.html">‹</a><h1>Choukai</h1><div class="kanan">N3</div></div>

<div class="pil" id="hari"></div>
<div id="isi"></div>

</div>

<script src="../aset/tz.js?v=1"></script>
<script>
let semua = [], hariAktif = 0;
(async () => {
  semua = await TZ.data('choukai.json');
  const hari = [...new Set(semua.map(x => x.hari_ke))].sort((a,b)=>a-b);
  hariAktif = hari[0];
  document.getElementById('hari').innerHTML = hari.map(h =>
    `<button class="${h===hariAktif?'aktif':''}" onclick="pilih(${h})">Hari ${h}</button>`).join('');
  gambar();
})();
function pilih(h) {
  hariAktif = h;
  [...document.querySelectorAll('#hari button')].forEach(b =>
    b.classList.toggle('aktif', b.textContent === 'Hari ' + h));
  gambar();
}
function gambar() {
  const d = semua.filter(x => x.hari_ke === hariAktif);
  document.getElementById('isi').innerHTML = d.map((x,i) => `
<div class="kartu">
  <div class="label">${TZ.esc(x.jenis||'Choukai')}</div>
  <div style="font-size:16px;font-weight:600;margin:6px 0">${TZ.esc(x.judul_jp||'')}</div>
  <div class="sub">${TZ.esc(x.judul_id||'')}</div>
  <button class="btn p" style="margin-top:12px" onclick="dengar(${i})">▶ Dengarkan</button>
  <div style="margin-top:12px">
    <button class="btn g" onclick="skrip(${i})">Lihat skrip</button>
  </div>
  <div id="sk${i}" style="display:none;margin-top:12px" class="contoh"></div>
  <div id="so${i}" style="margin-top:14px"></div>
</div>`).join('') || '<div class="kosong">Belum ada.</div>';
  d.forEach((x,i) => soal(x,i));
}
function dengar(i) {
  const d = semua.filter(x => x.hari_ke === hariAktif)[i];
  TZ.ucap(d.skrip_jp || d.judul_jp || '');
}
function skrip(i) {
  const d = semua.filter(x => x.hari_ke === hariAktif)[i];
  const el = document.getElementById('sk'+i);
  el.style.display = el.style.display === 'none' ? '' : 'none';
  el.innerHTML = TZ.esc(d.skrip_jp||'') + '<span class="id">' + TZ.esc(d.teks_id||'') + '</span>';
}
function soal(x, i) {
  let s = x.soal; try { if (typeof s === 'string') s = JSON.parse(s); } catch(e) { s = null; }
  const el = document.getElementById('so'+i);
  if (!s) { el.innerHTML = ''; return; }
  const arr = Array.isArray(s) ? s : [s];
  el.innerHTML = arr.map((q,j) => {
    const o = (q.opsi||q.pilihan||[]).map((t,k) =>
      `<button class="opsi" onclick="cek(this,${k},${q.jawaban})">${TZ.esc(t)}</button>`).join('');
    return `<div style="margin-bottom:12px"><div style="font-weight:600">
      ${j+1}. ${TZ.esc(q.tanya||q.pertanyaan||'')}</div>${o}</div>`;
  }).join('');
}
function cek(t, k, b) {
  const s = t.parentNode.querySelectorAll('.opsi');
  s.forEach(x => x.disabled = true);
  if (k === b) t.classList.add('benar'); else { t.classList.add('salah'); s[b].classList.add('benar'); }
}
</script>
</body>
</html>
