<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<title>Try out · 日本語 N3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../ikon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3b5bff">
<link rel="stylesheet" href="../aset/tz.css?v=1">
</head>
<body>
<div class="wrap">
<div class="atas"><a class="kembali" href="index.html">‹</a><h1>Try out</h1><div class="kanan">N3</div></div>

<div class="kartu" id="awal">
  <div class="label">Simulasi</div>
  <div class="judul-besar">Try out N3</div>
  <div class="sub">Soal dari kosakata, kanji, dan bunpou — 25 soal.</div>
  <div class="grid2" style="margin:16px 0">
    <div><div class="label">Soal</div><b>25</b></div>
    <div><div class="label">Waktu</div><b>25 menit</b></div>
  </div>
  <button class="btn p" onclick="mulaiKuis()">Mulai</button>
</div>
<div id="kuis" style="display:none">
  <div style="display:flex;justify-content:space-between;margin-bottom:8px">
    <span class="label" id="nomor">—</span><span class="badge" id="jam">25:00</span>
  </div>
  <div class="prog" style="margin-bottom:14px"><i id="bar" style="width:0%"></i></div>
  <div class="kartu"><div style="font-size:16px;font-weight:600" id="tanya">—</div>
    <div id="opsi" style="margin-top:14px"></div></div>
</div>
<div id="selesai" style="display:none">
  <div class="kartu rata"><div class="label">Hasil</div>
    <div style="font-size:44px;font-weight:700" id="hasil">—</div>
    <div class="sub" id="rinci">—</div>
    <button class="btn p" style="margin-top:16px" onclick="mulaiKuis()">Ulangi</button>
    <a class="btn g" style="margin-top:8px" href="nilai.html">Lihat nilai</a>
  </div>
</div>

</div>

<script src="../aset/tz.js?v=1"></script>
<script>const JUMLAH = 25;

let soal = [], idx = 0, benar = 0, mulai = 0, timer = null, durasi = 25 * 60;
async function mulaiKuis() {
  const k = await TZ.data('data.json');
  const kn = await TZ.data('kanji.json');
  const bp = await TZ.data('bunpou.json');
  const acak = (a) => a[Math.floor(Math.random() * a.length)];
  soal = [];
  for (let i = 0; i < JUMLAH; i++) {
    const tipe = i % 3;
    if (tipe === 0) {
      const x = acak(k);
      const salah = [acak(k), acak(k), acak(k)].map(y => y.arti).filter(a => a !== x.arti);
      soal.push({ tanya: '「' + x.kanji + '」の意味は？', benar: x.arti,
        opsi: acakUrut([x.arti, ...salah.slice(0, 3)]) });
    } else if (tipe === 1) {
      const x = acak(kn);
      const salah = [acak(kn), acak(kn), acak(kn)].map(y => y.arti).filter(a => a && a !== x.arti);
      soal.push({ tanya: '「' + x.kanji + '」の意味は？', benar: x.arti,
        opsi: acakUrut([x.arti, ...salah.slice(0, 3)]) });
    } else {
      const x = acak(bp);
      const salah = [acak(bp), acak(bp), acak(bp)].map(y => y.arti).filter(a => a !== x.arti);
      soal.push({ tanya: '「' + x.pola + '」の意味は？', benar: x.arti,
        opsi: acakUrut([x.arti, ...salah.slice(0, 3)]) });
    }
  }
  idx = 0; benar = 0; mulai = Date.now();
  document.getElementById('awal').style.display = 'none';
  document.getElementById('kuis').style.display = '';
  document.getElementById('selesai').style.display = 'none';
  clearInterval(timer);
  timer = setInterval(() => {
    const sisa = durasi - Math.floor((Date.now() - mulai) / 1000);
    document.getElementById('jam').textContent =
      Math.floor(Math.max(0, sisa) / 60) + ':' + String(Math.max(0, sisa) % 60).padStart(2, '0');
    if (sisa <= 0) selesaiKuis();
  }, 500);
  gambar();
}
function acakUrut(a) { return a.sort(() => Math.random() - 0.5); }
function gambar() {
  const s = soal[idx];
  if (!s) return selesaiKuis();
  document.getElementById('tanya').textContent = s.tanya;
  document.getElementById('nomor').textContent = (idx + 1) + ' / ' + soal.length;
  document.getElementById('bar').style.width = (idx / soal.length * 100) + '%';
  document.getElementById('opsi').innerHTML = s.opsi.map((o, i) =>
    `<button class="opsi" onclick="jawab(${i})">${String.fromCharCode(65 + i)}. ${TZ.esc(o)}</button>`
  ).join('');
}
function jawab(i) {
  const s = soal[idx];
  const el = document.getElementById('opsi');
  const tombol = el.querySelectorAll('.opsi');
  tombol.forEach(b => b.disabled = true);
  if (s.opsi[i] === s.benar) { tombol[i].classList.add('benar'); benar++; }
  else {
    tombol[i].classList.add('salah');
    tombol[s.opsi.indexOf(s.benar)].classList.add('benar');
  }
  setTimeout(() => { idx++; gambar(); }, 700);
}
function selesaiKuis() {
  clearInterval(timer);
  document.getElementById('kuis').style.display = 'none';
  document.getElementById('selesai').style.display = '';
  const persen = Math.round(benar / soal.length * 100);
  document.getElementById('hasil').textContent = persen + '%';
  document.getElementById('rinci').textContent = benar + ' benar dari ' + soal.length;
  const r = TZ.baca('riwayat', []);
  r.push({ jenis: 'Try out', persen, benar, total: soal.length,
    tanggal: new Date().toLocaleDateString('id-ID') });
  TZ.simpan('riwayat', r.slice(-40));
}
</script>
</body>
</html>
