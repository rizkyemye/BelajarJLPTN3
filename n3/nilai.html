<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<title>Nilai · 日本語 N3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../ikon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3b5bff">
<link rel="stylesheet" href="../aset/tz.css?v=1">
</head>
<body>
<div class="wrap">
<div class="atas"><a class="kembali" href="index.html">‹</a><h1>Nilai</h1><div class="kanan">N3</div></div>

<div id="isi"></div>

</div>

<script src="../aset/tz.js?v=1"></script>
<script>
(async () => {
  const riwayat = TZ.baca('riwayat', []);
  const el = document.getElementById('isi');
  if (!riwayat.length) {
    el.innerHTML = '<div class="kartu"><div class="kosong">Belum ada nilai.<br>' +
      '<span class="kecil">Kerjakan satu kuis dulu.</span></div></div>';
    return;
  }
  el.innerHTML = riwayat.slice().reverse().map(r => `
<div class="baris">
  <span class="ik ${r.persen >= 80 ? 'h' : (r.persen >= 60 ? 'k' : '')}">${r.persen}%</span>
  <span><b>${TZ.esc(r.jenis||'Kuis')}</b><small>${TZ.esc(r.tanggal||'')} · ${r.benar}/${r.total}</small></span>
</div>`).join('');
})();
</script>
</body>
</html>
