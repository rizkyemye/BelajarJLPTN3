<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<title>Bunpou · 日本語 N3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../aset/tz.css?v=1">
</head>
<body>
<div class="wrap">
<div class="atas"><a class="kembali" href="index.html">‹</a><h1>Bunpou</h1><div class="kanan">N3</div></div>

<div class="pil" id="tema"></div>
<div id="daftar"></div>

</div>

<nav class="nav">
  <a href="index.html" class=""><span>⌂</span>Beranda</a>
  <a href="belajar.html" class=""><span>単</span>Kosakata</a>
  <a href="practice.html" class=""><span>◆</span>Practice</a>
  <a href="kanji-daftar.html" class=""><span>漢</span>Kanji</a>
  <a href="bunpou.html" class="aktif"><span>文</span>Bunpou</a>
</nav>

<script src="../aset/tz.js?v=1"></script>
<script>
let semua = [], temaAktif = 'semua';

(async () => {
  semua = await TZ.data('bunpou.json');
  const tema = [...new Set(semua.map(x => x.tema_id).filter(Boolean))];
  document.getElementById('tema').innerHTML =
    `<button class="aktif" onclick="saring('semua',this)">Semua</button>` +
    tema.map(t => `<button onclick="saring('${TZ.esc(t)}',this)">${TZ.esc(t)}</button>`).join('');
  gambar();
})();

function gambar() {
  const d = semua.filter(x => temaAktif === 'semua' || x.tema_id === temaAktif);
  document.getElementById('daftar').innerHTML = d.map((x, i) => `
<details class="akordeon">
  <summary>${TZ.esc(x.pola)} <span class="badge" style="margin-left:auto">${TZ.esc(x.tema_id||'')}</span></summary>
  <div class="isi">
    <div class="pola">${TZ.esc(x.pola)}</div>
    <div>${TZ.esc(x.arti)}</div>
    ${x.rumus ? `<div class="kecil" style="margin-top:6px">rumus: ${TZ.esc(x.rumus)}</div>` : ''}
    ${x.penjelasan ? `<div style="margin-top:8px">${TZ.esc(x.penjelasan)}</div>` : ''}
    ${x.contoh_jp ? `<div class="contoh" style="margin-top:10px">${TZ.esc(x.contoh_jp)}
      <span class="id">${TZ.esc(x.contoh_id||'')}</span></div>` : ''}
    ${x.contoh_jp ? `<button class="btn g" style="margin-top:10px"
      onclick="TZ.ucap('${TZ.esc(x.contoh_jp).replace(/'/g, "\\'")}')">Dengarkan</button>` : ''}
  </div>
</details>`).join('');
}

function saring(t, tombol) {
  temaAktif = t;
  [...document.querySelectorAll('#tema button')].forEach(b => b.classList.remove('aktif'));
  tombol.classList.add('aktif');
  gambar();
}
</script>
</body>
</html>
