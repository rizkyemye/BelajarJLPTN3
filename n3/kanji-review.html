<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
<div class="wrap">
<div class="atas"><a class="kembali" href="index.html">‹</a><h1>Review kanji</h1><div class="kanan">N3</div></div>

<div class="label" style="margin-bottom:10px" id="jml">—</div>
<div class="flash" id="kartu" onclick="buka()">
  <div class="awal">KANJI</div>
  <div class="huruf" id="huruf">—</div>
  <div class="kana" id="kana"></div>
  <div class="arti" id="arti" style="display:none"></div>
  <div class="hint" id="hint">ketuk untuk balik</div>
</div>
<div class="nilai3" id="nilai" style="display:none">
  <button class="l" onclick="nilai('lupa')">Lupa</button>
  <button class="r" onclick="nilai('ragu')">Ragu</button>
  <button class="h" onclick="nilai('hafal')">Hafal</button>
</div>

</div>

<nav class="nav" style="--i:3">
  <span class="nav-tanda"></span>
  <a href="index.html" class=""><span class="ik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1z"/></svg></span><em>Beranda</em></a>
  <a href="belajar.html" class=""><span class="ik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h9a3 3 0 013 3v11a3 3 0 00-3-3H4z"/><path d="M20 5h-3a3 3 0 00-3 3v11"/></svg></span><em>Kosakata</em></a>

  <a href="kanji-daftar.html" class="aktif"><span class="ik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/></svg></span><em>Kanji</em></a>
  <a href="bunpou.html" class=""><span class="ik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg></span><em>Bunpou</em></a>
</nav>

<script src="../aset/tz.js?v=1"></script>
<script>
let semua = [], idx = 0, terbuka = false;
(async () => {
  semua = await TZ.data('kanji.json');
  const hm = TZ.baca('kanjiHafal', {});
  semua = semua.filter(x => !hm[x.kanji]);
  document.getElementById('jml').textContent = semua.length + ' kanji belum hafal';
  if (!semua.length) { document.getElementById('kartu').innerHTML = '<div class="huruf">✓</div>' +
    '<div class="kana">semua sudah hafal</div>'; return; }
  tampil();
})();
function tampil() {
  const x = semua[idx];
  if (!x) { document.getElementById('kartu').innerHTML = '<div class="huruf">✓</div>'; return; }
  terbuka = false;
  document.getElementById('huruf').textContent = x.kanji;
  document.getElementById('kana').textContent = '';
  document.getElementById('arti').style.display = 'none';
  document.getElementById('nilai').style.display = 'none';
}
function buka() {
  const x = semua[idx]; if (!x) return;
  terbuka = !terbuka;
  document.getElementById('kana').textContent = terbuka ?
    ((x.onyomi||'') + ' / ' + (x.kunyomi||'')).replace(/^\s*\/\s*|\s*\/\s*$/g,'') : '';
  document.getElementById('arti').textContent = x.arti || '';
  document.getElementById('arti').style.display = terbuka ? '' : 'none';
  document.getElementById('nilai').style.display = terbuka ? '' : 'none';
}
function nilai(n) {
  if (n === 'hafal') {
    const hm = TZ.baca('kanjiHafal', {});
    hm[semua[idx].kanji] = Date.now();
    TZ.simpan('kanjiHafal', hm);
  }
  idx++;
  document.getElementById('jml').textContent = Math.max(0, semua.length - idx) + ' kanji tersisa';
  tampil();
}
</script>
</body>
</html>
