<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<title>敬語 · 日本語 N3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../ikon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3b5bff">
<link rel="stylesheet" href="../aset/tz.css?v=1">
</head>
<body>
<div class="wrap">
<div class="atas"><a class="kembali" href="index.html">‹</a><h1>敬語</h1><div class="kanan">N3</div></div>

<div class="pil" id="kat"></div>
<div id="isi"></div>

</div>

<script src="../aset/tz.js?v=1"></script>
<script>
let semua = [], kat = 'semua';
(async () => {
  semua = await TZ.data('keigo.json');
  const k = [...new Set(semua.map(x => x.kategori).filter(Boolean))];
  document.getElementById('kat').innerHTML =
    `<button class="aktif" onclick="saring('semua',this)">Semua</button>` +
    k.map(t => `<button onclick="saring('${TZ.esc(t)}',this)">${TZ.esc(t)}</button>`).join('');
  gambar();
})();
function gambar() {
  const d = semua.filter(x => kat === 'semua' || x.kategori === kat);
  document.getElementById('isi').innerHTML = d.map(x => `
<div class="kartu">
  <div class="label">${TZ.esc(x.kategori||'')}</div>
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin:8px 0">
    <div style="font-size:17px;font-weight:600">${TZ.esc(x.dasar||'')}</div>
    <div class="sub">${TZ.esc(x.arti||'')}</div>
  </div>
  <div style="font-size:14px"><span class="badge">尊敬</span> ${TZ.esc(x.sonkei||'—')}</div>
  <div style="font-size:14px;margin-top:6px"><span class="badge h">謙譲</span> ${TZ.esc(x.kenjo||'—')}</div>
  ${x.contoh_jp ? `<div class="contoh" style="margin-top:10px">${TZ.esc(x.contoh_jp)}
    <span class="id">${TZ.esc(x.contoh_id||'')}</span></div>` : ''}
</div>`).join('') || '<div class="kosong">Belum ada.</div>';
}
function saring(k, t) {
  kat = k;
  [...document.querySelectorAll('#kat button')].forEach(b => b.classList.remove('aktif'));
  t.classList.add('aktif');
  gambar();
}
</script>
</body>
</html>
