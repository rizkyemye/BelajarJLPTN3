<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<title>Dokkai · 日本語 N3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../aset/tz.css?v=1">
</head>
<body>
<div class="wrap">
<div class="atas"><a class="kembali" href="index.html">‹</a><h1>Dokkai</h1><div class="kanan">N3</div></div>

<div class="pil" id="hari"></div>
<div id="isi"></div>

</div>

<script src="../aset/tz.js?v=1"></script>
<script>
let semua = [], aktif = null, hariAktif = 0;

(async () => {
  semua = await TZ.data('dokkai.json');
  const hari = [...new Set(semua.map(x => x.hari_ke))].sort((a,b)=>a-b);
  hariAktif = hari[0];
  document.getElementById('hari').innerHTML = hari.map(h =>
    `<button class="${h===hariAktif?'aktif':''}" onclick="pilihHari(${h})">Hari ${h}</button>`).join('');
  gambar();
})();

function pilihHari(h) {
  hariAktif = h;
  [...document.querySelectorAll('#hari button')].forEach(b =>
    b.classList.toggle('aktif', b.textContent === 'Hari ' + h));
  gambar();
}

function gambar() {
  const d = semua.filter(x => x.hari_ke === hariAktif);
  document.getElementById('isi').innerHTML = d.map((x, i) => `
<div class="kartu">
  <div class="label">${TZ.esc(x.tema || 'Dokkai')}</div>
  <div style="font-size:17px;font-weight:600;margin:6px 0">${TZ.esc(x.judul_jp || '')}</div>
  <div class="sub">${TZ.esc(x.judul_id || '')}</div>
  <div class="contoh" style="margin-top:14px;font-size:14.5px">${TZ.esc(x.teks_jp || '')}</div>
  <div class="kecil" style="margin-top:10px">${TZ.esc(x.teks_id || '')}</div>
  <div id="soal${i}" style="margin-top:14px"></div>
</div>`).join('') || '<div class="kosong">Belum ada bacaan.</div>';
  d.forEach((x, i) => gambarSoal(x, i));
}

function gambarSoal(x, i) {
  let soal = x.soal;
  try { if (typeof soal === 'string') soal = JSON.parse(soal); } catch (e) { soal = null; }
  const el = document.getElementById('soal' + i);
  if (!soal) { el.innerHTML = ''; return; }
  const daftar = Array.isArray(soal) ? soal : [soal];
  el.innerHTML = daftar.map((s, j) => {
    const opsi = (s.opsi || s.pilihan || []).map((o, k) =>
      `<button class="opsi" onclick="cek(this, ${k}, ${s.jawaban})">${TZ.esc(o)}</button>`).join('');
    return `<div style="margin-bottom:12px"><div style="font-size:14px;font-weight:600">
      ${j+1}. ${TZ.esc(s.tanya || s.pertanyaan || '')}</div>${opsi}</div>`;
  }).join('');
}

function cek(tombol, k, benar) {
  const semua = tombol.parentNode.querySelectorAll('.opsi');
  semua.forEach(b => b.disabled = true);
  if (k === benar) tombol.classList.add('benar');
  else { tombol.classList.add('salah'); semua[benar].classList.add('benar'); }
}
</script>
</body>
</html>
